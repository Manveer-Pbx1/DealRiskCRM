<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e3a8a" opacity="0.1"/>
  
  <!-- Shield outline (represents risk protection) -->
  <path d="M100 30 L140 45 L140 85 Q140 115 100 140 Q60 115 60 85 L60 45 Z" 
        fill="none" 
        stroke="#1e3a8a" 
        stroke-width="3"
        stroke-linejoin="round"/>
  
  <!-- Inner shield fill with gradient -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <path d="M100 35 L135 48 L135 85 Q135 112 100 135 Q65 112 65 85 L65 48 Z" 
        fill="url(#shieldGradient)"/>
  
  <!-- Chart bars (represents analysis) -->
  <g transform="translate(80, 70)">
    <!-- Bar 1 -->
    <rect x="0" y="25" width="8" height="25" fill="#fff" opacity="0.9" rx="1"/>
    <!-- Bar 2 -->
    <rect x="12" y="15" width="8" height="35" fill="#fff" opacity="0.9" rx="1"/>
    <!-- Bar 3 -->
    <rect x="24" y="20" width="8" height="30" fill="#fff" opacity="0.9" rx="1"/>
  </g>
  
  <!-- Trend line overlay -->
  <path d="M 84 92 L 92 85 L 100 88 L 108 80" 
        stroke="#fbbf24" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Warning indicator (subtle triangle) -->
  <path d="M 100 58 L 106 68 L 94 68 Z" 
        fill="#fbbf24" 
        opacity="0.9"/>
  <text x="100" y="67" 
        font-family="Arial, sans-serif" 
        font-size="9" 
        font-weight="bold" 
        fill="#1e3a8a" 
        text-anchor="middle">!</text>
  
  <!-- Company name -->
  <text x="100" y="170" 
        font-family="Arial, sans-serif" 
        font-size="16" 
        font-weight="bold" 
        fill="#1e3a8a" 
        text-anchor="middle">DEAL RISK</text>
  
  <text x="100" y="186" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="normal" 
        fill="#64748b" 
        text-anchor="middle">ANALYST</text>
</svg>